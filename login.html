
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>style website</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #b99591;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            height: 530px;
            position: relative;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }

        #switch {
            display: none;
        }

        .form-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            padding: 28px 30px;
            background: white;
            transition: all 0.9s ease;
            z-index: 2;
        }

        .register-panel {
            left: 0;
            visibility: visible;
            opacity: 1;
        }

        .login-panel {
            right: 0;
            visibility: hidden;
            opacity: 0;
        }

        .image-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background:
                url("1.jpg")
                center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: center;
            color: white;
            padding: 35px 20px;
            transition: transform 0.9s ease;
            z-index: 3;
        }

        .form-panel h2 {
            font-size: 26px;
            font-weight: 800;
            color: #34222f;
        }

        .subtitle {
            font-size: 11px;
            color: #777;
            margin-bottom: 20px;
        }

        .home-link {
            margin-bottom: 12px;
            text-align: left;
        }

        .home-link a {
            text-decoration: none;
            color: #34222f;
            font-size: 11px;
            font-weight: 600;
        }

        .home-link a:hover {
            color: #a997a3;
            text-decoration: underline;
        }

        .form-label {
            font-size: 11px;
            font-weight: 600;
            color: #34222f;
            margin-bottom: 4px;
        }

        .form-control,
        .form-select {
            height: 37px;
            font-size: 11px;
            border-radius: 7px;
            background-color: #f7f9fc;
            border: 1px solid #e0e5ed;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #34222f;
        }

        .submit-btn {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #624551);
            color: white;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #a997a3;
            color: white;
            transform: translateY(-2px);
        }

        .bottom-text {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-top: 18px;
        }

        .bottom-text label {
            color: #34222f;
            font-weight: 700;
            cursor: pointer;
        }

        .bottom-text label:hover {
            text-decoration: underline;
        }

        .forgot {
            text-align: right;
            font-size: 11px;
        }

        .forgot a {
            text-decoration: none;
            color: #34222f;
        }

        #switch:checked ~ .register-panel {
            transform: translateX(-100%);
            opacity: 0;
            visibility: hidden;
        }

        #switch:checked ~ .login-panel {
            opacity: 1;
            visibility: visible;
    
        }

        #switch:checked ~ .image-panel {
            transform: translateX(-100%);
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .main-container {
                max-width: 450px;
                height: 730px;
            }

            .image-panel {
                width: 100%;
                height: 25%;
                padding: 12px;
                top: 0;
                right: 0;
                background-size: contain;
                background-repeat: no-repeat;
            }

            .image-content h1 {
                font-size: 25px;
                margin-top: 0;
            }

            .image-content h4 {
                font-size: 12px;
                margin-top: 5px;
            }

            .image-content p,
            .cap {
                display: none;
            }

            .form-panel {
                width: 100%;
                height: 75%;
                top: 25%;
                padding: 25px;
            }

            .form-panel h2 {
                font-size: 24px;
            }

            .form-control,
            .form-select {
                height: 39px;
            }

            #switch:checked ~ .register-panel {
                transform: translateY(100%);
            }

            #switch:checked ~ .login-panel {
                transform: translateY(0);
            }

            #switch:checked ~ .image-panel {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="main-container">

    <input type="checkbox" id="switch">

    <div class="form-panel register-panel">

        <div class="home-link">
            <a href="index.html">← Back to Home</a>
        </div>

        <h2>Create an account</h2>

        <p class="subtitle">
            Explore the latest fashion trends and discover styles that match your personality.
        </p>

        <form>
            <div class="row g-2">

                <div class="col-6">
                    <label class="form-label">First name *</label>
                    <input type="text" class="form-control"
                    placeholder="e.g. John" required>
                </div>

                <div class="col-6">
                    <label class="form-label">Last name</label>
                    <input type="text" class="form-control"
                    placeholder="e.g. Doe">
                </div>

                <div class="col-6">
                    <label class="form-label">Username *</label>
                    <input type="text" class="form-control"
                    placeholder="Enter username" required>
                </div>

                <div class="col-6">
                    <label class="form-label">Email address *</label>
                    <input type="email" class="form-control"
                    placeholder="Enter email" required>
                </div>


                <div class="col-6">
                    <label class="form-label">Password *</label>
                    <input type="password" class="form-control"
                    placeholder="Password" required>
                </div>

                <div class="col-6">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" class="form-control"
                    placeholder="Repeat password" required>
                </div>

            </div>

            <button type="submit" class="btn submit-btn mt-3">
                Create Account &nbsp; →
            </button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <label for="switch">Sign In</label>
        </p>

    </div>
    <div class="form-panel login-panel">

        <div class="home-link">
            <a href="index.html">← Back to Home</a>
        </div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to continue your journey.
        </p>

        <form>

            <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" class="form-control"
                placeholder="Enter your email address" required>
            </div>

            <div class="mb-2">
                <label class="form-label">Password *</label>
                <input type="password" class="form-control"
                placeholder="Enter your password" required>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn submit-btn mt-4">
                Sign In &nbsp; →
            </button>

        </form>

        <p class="bottom-text mt-4">
            Don't have an account?
            <label for="switch">Sign Up</label>
        </p>

    </div>
    <div class="image-panel"></div>

</div>

</body>
</html>
